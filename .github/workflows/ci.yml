name: CI

# Se dispara en cada push y pull_request sobre main, tal como exige la pauta.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: student-performance-api

jobs:
  # ------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Instalar ruff
        run: pip install ruff
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  # ------------------------------------------------------------------
  test:
    name: Pruebas (pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Correr pytest
        run: pytest tests/ -v

  # ------------------------------------------------------------------
  build:
    name: Build de imagen Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build imagen
        run: docker build -t ${{ env.IMAGE_NAME }}:ci .
      - name: Guardar imagen como artifact
        run: docker save ${{ env.IMAGE_NAME }}:ci -o image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

  # ------------------------------------------------------------------
  smoke-test:
    name: Prueba de humo (contenedor real)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
      - name: Cargar imagen
        run: docker load -i image.tar
      - name: Levantar contenedor
        run: docker run -d --name api-smoke -p 8000:8000 ${{ env.IMAGE_NAME }}:ci
      - name: Esperar a que el servicio esté listo
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "Servicio listo."
              exit 0
            fi
            echo "Esperando servicio... intento $i"
            sleep 2
          done
          echo "El servicio no respondió a tiempo."
          docker logs api-smoke
          exit 1
      - name: Verificar GET /health responde 200 y modelo cargado
        run: |
          response=$(curl -sf http://localhost:8000/health)
          echo "$response"
          echo "$response" | grep -q '"model_loaded":true'
      - name: Verificar POST /predict responde 200 con predicción real
        run: |
          response=$(curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"school":"GP","sex":"F","age":17,"address":"U","famsize":"GT3","Pstatus":"T","Medu":3,"Fedu":2,"Mjob":"services","Fjob":"other","reason":"course","guardian":"mother","traveltime":1,"studytime":2,"failures":0,"schoolsup":"no","famsup":"yes","paid":"no","activities":"yes","nursery":"yes","higher":"yes","internet":"yes","romantic":"no","famrel":4,"freetime":3,"goout":3,"Dalc":1,"Walc":2,"health":4,"absences":4,"G1":12,"G2":13}')
          echo "$response"
          echo "$response" | grep -q 'predicted_g3'
      - name: Verificar que una entrada inválida da 422 (no 500)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" -d '{"sex":"X"}')
          test "$code" = "422"
      - name: Logs del contenedor (siempre, para depurar si algo falla)
        if: always()
        run: docker logs api-smoke
      - name: Detener contenedor
        if: always()
        run: docker rm -f api-smoke

  # ------------------------------------------------------------------
  # Publica la imagen en GHCR solo al crear un tag (ej. v1.0.0), y solo
  # si TODOS los jobs anteriores pasaron. No requiere secrets propios:
  # usa el GITHUB_TOKEN que la Action provee automáticamente.
  publish:
    name: Publicar imagen en GHCR
    runs-on: ubuntu-latest
    needs: smoke-test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build y push
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          TAG=${GITHUB_REF#refs/tags/}
          docker build -t $IMAGE:$TAG -t $IMAGE:latest .
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest
